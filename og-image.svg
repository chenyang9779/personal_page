<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf9f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f1ee;stop-opacity:1" />
    </linearGradient>
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.7" fill="#1a1a1a" opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#dot-grid)"/>

  <!-- Faint topology motif (right side, decorative) -->
  <g opacity="0.05">
    <!-- Node column -->
    <line x1="880" y1="120" x2="880" y2="380" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="880" cy="160" r="4" fill="#1a1a1a"/>
    <circle cx="880" cy="250" r="4" fill="#1a1a1a"/>
    <circle cx="880" cy="340" r="4" fill="#1a1a1a"/>
    <!-- Connection lines -->
    <line x1="884" y1="160" x2="1020" y2="160" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="3 4"/>
    <line x1="884" y1="250" x2="1020" y2="250" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="3 4"/>
    <line x1="884" y1="340" x2="1020" y2="340" stroke="#1a1a1a" stroke-width="0.5" stroke-dasharray="3 4"/>
    <!-- Scheduler -->
    <circle cx="1020" cy="250" r="4" fill="#1a1a1a"/>
    <line x1="1024" y1="160" x2="1024" y2="246" stroke="#1a1a1a" stroke-width="0.5"/>
    <line x1="1024" y1="340" x2="1024" y2="254" stroke="#1a1a1a" stroke-width="0.5"/>
    <!-- Workload -->
    <circle cx="1020" cy="400" r="3" fill="#1a1a1a"/>
    <line x1="1024" y1="254" x2="1020" y2="396" stroke="#1a1a1a" stroke-width="0.5"/>
  </g>

  <!-- Left content area -->
  <g transform="translate(80, 200)">
    <!-- Monogram badge -->
    <rect x="0" y="0" width="64" height="64" rx="8" fill="#2b6cb0" opacity="0.9"/>
    <text x="32" y="42" font-family="Georgia, serif" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="400">CW</text>

    <!-- Name -->
    <text x="90" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#1a1a1a">Chenyang Wu</text>

    <!-- Alternate name -->
    <text x="90" y="66" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="15" fill="#888888" letter-spacing="0.05em">Aaron</text>

    <!-- Accent separator -->
    <line x1="90" y1="82" x2="160" y2="82" stroke="#2b6cb0" stroke-width="1.5" opacity="0.6"/>

    <!-- Role -->
    <text x="90" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#555555">Software &amp; Research Engineer</text>

    <!-- Tagline -->
    <text x="90" y="148" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="13" fill="#888888" letter-spacing="0.02em">AI Infrastructure · Distributed Systems · CPU Performance · Backend Engineering</text>

    <!-- Location -->
    <text x="90" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#888888">Based in London.</text>
  </g>
</svg>
